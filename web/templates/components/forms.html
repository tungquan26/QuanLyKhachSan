{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">{% endmacro %}
{% macro field(name, label, value='', required=false, maxlength=100, inputmode='text', autocomplete='off') %}
<div class="field">
  <label for="{{ name }}">{{ label }}</label>
  <input id="{{ name }}" name="{{ name }}" value="{{ value }}" maxlength="{{ maxlength }}" inputmode="{{ inputmode }}" {% if required %}required{% endif %} autocomplete="{{ autocomplete }}">
</div>
{% endmacro %}
{% macro select(name, label, options, selected='', disabled=false) %}
<div class="field">
  <label for="{{ name }}">{{ label }}</label>
  <div class="select-wrap"><select id="{{ name }}" name="{{ name }}" required {% if disabled %}disabled{% endif %}>
    <option value="" disabled hidden></option>
    {% for value, text in options %}<option value="{{ value }}" {% if value|string == selected %}selected{% endif %}>{{ text }}</option>{% endfor %}
  </select></div>
</div>
{% endmacro %}
